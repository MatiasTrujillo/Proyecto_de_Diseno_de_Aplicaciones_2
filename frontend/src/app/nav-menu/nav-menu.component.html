<nav class="navbar">
  <div class="nav-left">
    <a routerLink="/" class="logo">Simulator</a>
  </div>
  <div class="nav-right">
    <button (click)="logout()" class="logout-button">Cerrar sesión</button>
  </div>
</nav>

<div class="card-container">
  <div class="card">
    <h3>Create Class</h3>
    <p>Define a new class for your simulation logic.</p>
    <button (click)="openModal('class')">Open</button>
  </div>

  <div class="card">
    <h3>Create Method</h3>
    <p>Create a method and associate it with a class.</p>
    <button (click)="openModal('method')">Open</button>
  </div>

  <div class="card">
    <h3>Create Attribute</h3>
    <p>Add a new attribute to your simulation class.</p>
    <button (click)="openModal('attribute')">Open</button>
  </div>

  <div class="card">
    <h3>Create Local Variable</h3>
    <p>Assign a local variable to your methods.</p>
    <button (click)="openModal('localVariable')">Open</button>
  </div>
</div>

<div class="modal" *ngIf="activeModal === 'class'">
  <div class="modal-content">
    <button class="close" (click)="closeModal()">×</button>
    <app-create-class></app-create-class>
  </div>
</div>

<div class="modal" *ngIf="activeModal === 'method'">
  <div class="modal-content">
    <button class="close" (click)="closeModal()">×</button>
    <app-create-method></app-create-method>
  </div>
</div>

<div class="modal" *ngIf="activeModal === 'attribute'">
  <div class="modal-content">
    <button class="close" (click)="closeModal()">×</button>
    <app-createattribute></app-createattribute>
  </div>
</div>

<div class="modal" *ngIf="activeModal === 'localVariable'">
  <div class="modal-content">
    <button class="close" (click)="closeModal()">×</button>
    <app-createlocalvariable></app-createlocalvariable>
  </div>
</div>
