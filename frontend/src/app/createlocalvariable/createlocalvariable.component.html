<form [formGroup]="localVariableFrom" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="name">Name:</label>
    <input id="name" formControlName="name" type="text" class="form-control" required />
  </div>

  <div class="form-group">
    <label for="referenceType">Reference Type:</label>
    <select id="referenceType" formControlName="ReferenceType" class="form-control" required>
      <option [ngValue]="null">-- Select Reference Type --</option>
      <option *ngFor="let type of localVariableTypes" [value]="type.id">{{ type.name }}</option>
    </select>
  </div>

  <div class="form-group">
    <label for="instanceType">Instance Type:</label>
    <select id="instanceType" formControlName="InstanceType" class="form-control" required>
      <option [ngValue]="null">-- Select Instance Type --</option>
      <option *ngFor="let type of localVariableTypes" [value]="type.id">{{ type.name }}</option>
    </select>
  </div>

  <button type="submit" class="btn btn-primary" [disabled]="localVariableFrom.invalid">Create Local Variable</button>
</form>
