<div class="form-container">
  <h2>Delete Interface</h2>
  <div *ngIf="error" class="error">{{ error }}</div>
  <div *ngIf="message" class="message">{{ message }}</div>

  <p>Are you sure you want to delete the interface <strong>{{ interfaceData.name }}</strong>?</p>

  <div class="button-group">
    <button class="danger" (click)="onDelete()">Delete</button>
    <button class="close" (click)="closeModal()" type="button">Cancel</button>
  </div>
</div>
