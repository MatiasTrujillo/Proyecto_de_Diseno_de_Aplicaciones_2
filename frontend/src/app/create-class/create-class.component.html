<form (ngSubmit)="onSubmit()">
  <label for="name">Class Name:</label>
  <input id="name" name="name" [(ngModel)]="newClass.name" required />

  <label for="stereotype">Stereotype:</label>
  <select id="stereotype" name="stereotype" [(ngModel)]="newClass.Stereotype" required>
    <option *ngFor="let entry of getStereotypeEntries()" [value]="entry[1]">
      {{ entry[0] }}
    </option>
  </select>

  <button type="submit">Create Class</button>
</form>
