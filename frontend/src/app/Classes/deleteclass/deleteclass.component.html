<h2>Delete Class</h2>

<!-- Success message -->
<div *ngIf="message" class="success-message">{{ message }}</div>

<!-- Error message -->
<div *ngIf="error" class="error-message">{{ error }}</div>

<form [formGroup]="deleteForm" (ngSubmit)="onDelete()">
  <label for="id">Select a class to delete:</label>
  <select formControlName="id" required>
    <option *ngFor="let c of classes" [value]="c.id">{{ c.name }}</option>
  </select>

  <br /><br />
  <button type="submit">Delete</button>
</form>
