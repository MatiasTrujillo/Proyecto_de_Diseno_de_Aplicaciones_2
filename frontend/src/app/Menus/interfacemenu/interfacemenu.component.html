<nav class="navbar">
  <div class="nav-left">
    <a routerLink="/" class="logo">Simulator</a>
  </div>
  <div class="nav-right">
    <button (click)="goToNavMenu()" class="logout-button">Go To Menu</button>
  </div>
</nav>

<div class="sidebar">
  <h2>Manage your entities</h2>
  <button (click)="goTo('/ClassMenuComponent')">Class</button>
  <button (click)="goTo('/MethodMenuComponent')">Method</button>
  <button (click)="goTo('/AttributeMenuComponent')">Attribute</button>
  <button (click)="goTo('/NameSpaceMenuComponent')">NameSpace</button>
  <button (click)="goTo('/ParameterMenuComponent')">Parameter</button>
  <button (click)="goTo('/LocalVariableMenuComponent')">Local Variable</button>
  <button (click)="goTo('/InterfaceMenuComponent')">Interface</button>
  <button (click)="goTo('/ExportdataComponent')">Go To Export</button>
  <div>
    <button (click)="goTo('/database')">Data Base</button> <!-- Asegúrate de que esta ruta exista -->
  </div>
</div>

  <!-- Interface -->

  <div class="card-container">
  <div class="card" *ngFor="let interfaceItem of interfaces">
    <h3>{{ interfaceItem.name }}</h3>
    <div class="button-group">
      <button class="danger" (click)="openModal('deleteclass', interfaceItem)">Delete</button>
      <button class="secondary" (click)="openModal('AsociatetoSignatur', interfaceItem)">Asociate to Signatur</button>
    </div>
  </div>
</div>


<div class="modal" *ngIf="activeModal === 'deleteclass'">
  <div class="modal-content">
    <button class="close" (click)="closeModal()">×</button>
    <app-deleteinterface
      [interfaceData]="selectedInterface!"
      (close)="closeModal()"
    ></app-deleteinterface>
  </div>
</div>

<div class="modal" *ngIf="activeModal === 'AsociatetoSignatur'">
  <div class="modal-content">
    <button class="close" (click)="closeModal()">×</button>
    <app-associate-interface-signature
      [interfaceData]="selectedInterface!"
      (close)="closeModal()"
    ></app-associate-interface-signature>
  </div>
</div>
