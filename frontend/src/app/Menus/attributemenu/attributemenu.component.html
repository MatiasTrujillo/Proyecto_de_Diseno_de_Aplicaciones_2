<nav class="navbar">
  <div class="nav-left">
    <a routerLink="/" class="logo">Simulator</a>
  </div>
  <div class="nav-right">
    <button (click)="goToNavMenu()" class="logout-button">Go To Menu</button>
  </div>
</nav>

<div class="sidebar">
  <button (click)="goToClassMenu()">Manage Class</button>
  <button (click)="goToMethodMenu()">Manage Method</button>
  <button (click)="goToAttributeMenu()">Manage Attribute</button>
</div>

<div class="card-container">
  <div class="card" *ngFor="let attributeItem of attributes">
    <h3>{{ attributeItem.name }}</h3>
    <div class="button-group">
        <button class="secondary" (click)="openModal('updateattribute', attributeItem)">Update</button>
        <button class="danger" (click)="openModal('deleteattribute', attributeItem)">Delete</button>
        <button class="secondary" (click)="openModal('asociate', attributeItem)">With Class</button>
        <button class="secondary" (click)="openModal('set', attributeItem)">With InvokedMethod</button>
    </div>
  </div>
</div>

<div class="modal" *ngIf="activeModal === 'deleteattribute'">
  <div class="modal-content">
    <button class="close" (click)="closeModal()">×</button>
    <app-deleteattribute
    [attributeData]="selectedAttribute!"
      (close)="closeModal()"
    ></app-deleteattribute>
  </div>
</div>

<div class="modal" *ngIf="activeModal === 'asociate'">
  <div class="modal-content">
    <button class="close" (click)="closeModal()">×</button>
    <app-associateattributewithclass
    [attributeData]="selectedAttribute!"
      (close)="closeModal()"
    ></app-associateattributewithclass>
  </div>
</div>

<div class="modal" *ngIf="activeModal === 'set'">
  <div class="modal-content">
    <button class="close" (click)="closeModal()">×</button>
    <app-set-invoke-method
    [attributeData]="selectedAttribute!"
      (close)="closeModal()"
    ></app-set-invoke-method>
  </div>
</div>

<div class="modal" *ngIf="activeModal === 'updateattribute'">
  <div class="modal-content">
    <button class="close" (click)="closeModal()">×</button>
    <app-updateattribute
    [attributeData]="selectedAttribute!"
      (close)="closeModal()"
    ></app-updateattribute>
  </div>
</div>

<div [innerHTML]="result"></div>
