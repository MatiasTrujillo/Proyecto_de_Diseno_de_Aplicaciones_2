<nav class="navbar">
  <div class="nav-left">
    <a routerLink="/" class="logo">Simulator</a>
  </div>
  <div class="nav-right">
    <button (click)="goToNavMenu()" class="logout-button">Go To Menu</button>
  </div>
</nav>

<div class="sidebar">
  <h2>Manage your entities</h2>
  <button (click)="goTo('/ClassMenuComponent')">Class</button>
  <button (click)="goTo('/MethodMenuComponent')">Method</button>
  <button (click)="goTo('/AttributeMenuComponent')">Attribute</button>
  <button (click)="goTo('/NameSpaceMenuComponent')">NameSpace</button>
  <button (click)="goTo('/ParameterMenuComponent')">Parameter</button>
  <button (click)="goTo('/LocalVariableMenuComponent')">Local Variable</button>
  <button (click)="goTo('/InterfaceMenuComponent')">Interface</button>
  <button (click)="goTo('/ExportdataComponent')">Go To Export</button>
  <button (click)="goTo('/database')">Data Base</button>
</div>

<div class="card-container">
  <div class="card" *ngFor="let attributeItem of attributes">
    <h3>{{ attributeItem.name }}</h3>
    <div class="button-group">
      <button class="secondary" (click)="openModal('updateattribute', attributeItem)">Update</button>
      <button class="danger" (click)="openModal('deleteattribute', attributeItem)">Delete</button>
      <button class="secondary" (click)="openModal('asociate', attributeItem)">With Class</button>
      <button class="secondary" (click)="openModal('set', attributeItem)">With InvokedMethod</button>
    </div>
  </div>
</div>

<!-- Delete Attribute Modal -->
<div class="modal" *ngIf="activeModal === 'deleteattribute'">
  <div class="modal-content">
    <button class="close" (click)="closeModal()">×</button>
    <app-deleteattribute
      [attributeData]="selectedAttribute!"
      (close)="onAttributeChanged()"
    ></app-deleteattribute>
  </div>
</div>

<!-- Update Attribute Modal -->
<div class="modal" *ngIf="activeModal === 'updateattribute'">
  <div class="modal-content">
    <button class="close" (click)="closeModal()">×</button>
    <app-updateattribute
      [attributeData]="selectedAttribute!"
      (close)="onAttributeChanged()"
    ></app-updateattribute>
  </div>
</div>

<!-- Associate with Class Modal -->
<div class="modal" *ngIf="activeModal === 'asociate'">
  <div class="modal-content">
    <button class="close" (click)="closeModal()">×</button>
    <app-associateattributewithclass
      [attributeData]="selectedAttribute!"
      (close)="onAttributeChanged()"
    ></app-associateattributewithclass>
  </div>
</div>

<!-- Set Invoked Method Modal -->
<div class="modal" *ngIf="activeModal === 'set'">
  <div class="modal-content">
    <button class="close" (click)="closeModal()">×</button>
    <app-set-invoke-method
      [attributeData]="selectedAttribute!"
      (close)="onAttributeChanged()"
    ></app-set-invoke-method>
  </div>
</div>

<div [innerHTML]="result"></div>
