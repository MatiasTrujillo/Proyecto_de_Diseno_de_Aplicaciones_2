<nav class="navbar">
  <div class="nav-left">
    <a routerLink="/" class="logo">Simulator</a>
  </div>
  <div class="nav-right">
    <button (click)="goToNavMenu()" class="logout-button">Go To Menu</button>
  </div>
</nav>

<div class="card-container">
  <div class="card" *ngFor="let classItem of classes">
    <h3>{{ classItem.name }}</h3>
    <div class="button-group">
      <button class="secondary" (click)="openModal('updateclass', classItem)">Update</button>
      <button class="danger" (click)="openModal('deleteclass', classItem)">Delete</button>
    </div>
  </div>
</div>

<div class="sidebar">
  <button (click)="goToClassMenu()">Manage Class</button>
  <button (click)="goToMethodMenu()">Nuevo Método</button>
  <button (click)="goToAttributeMenu()">Manage Attribute</button>
  <button (click)="goToNameSpace()">Manage NameSpace</button>
</div>

<div class="modal" *ngIf="activeModal === 'updateclass'">
  <div class="modal-content">
    <button class="close" (click)="closeModal()">×</button>
    <app-updateclass
      [classData]="selectedClass!"
      (close)="closeModal()"
    ></app-updateclass>
  </div>
</div>

<!-- Modal para eliminar -->
<div class="modal" *ngIf="activeModal === 'deleteclass'">
  <div class="modal-content">
    <button class="close" (click)="closeModal()">×</button>
    <app-deleteclass
      [classData]="selectedClass!"
      (close)="closeModal()"
    ></app-deleteclass>
  </div>
</div>
