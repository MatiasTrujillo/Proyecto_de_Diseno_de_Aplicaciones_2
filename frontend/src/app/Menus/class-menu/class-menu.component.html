<nav class="navbar">
  <div class="nav-left">
    <a routerLink="/" class="logo">Simulator</a>
  </div>
  <div class="nav-right">
   <button (click)="logout()" class="logout-button">log out</button>
  </div>
</nav>


<div class="manage-interface-header">
  <h1>Manage Classes</h1>
  <div class="header-underline"></div>
</div>


<div class="card-container">
  <div class="card" *ngFor="let classItem of classes">
    <button class="info-btn" (click)="openModal('infoclass', classItem)" title="Info">ℹ️</button>
    <h3>{{ classItem.name }}</h3>
    <div class="button-group">
      <button class="secondary" (click)="openModal('updateclass', classItem)">Update</button>
      <button class="danger" (click)="openModal('deleteclass', classItem)">Delete</button>
    </div>
  </div>
</div>

<div class="sidebar">
  <h2>Manage your entities</h2>
  <button (click)="goTo('/ClassMenuComponent')">Class</button>
  <button (click)="goTo('/MethodMenuComponent')">Method</button>
  <button (click)="goTo('/AttributeMenuComponent')">Attribute</button>
  <button (click)="goTo('/NameSpaceMenuComponent')">NameSpace</button>
  <button (click)="goTo('/ParameterMenuComponent')">Parameter</button>
  <button (click)="goTo('/LocalVariableMenuComponent')">Local Variable</button>
  <button (click)="goTo('/InterfaceMenuComponent')">Interface</button>
  <button (click)="goTo('/ExportdataComponent')">Go To Export</button>
</div>

<!-- Modal para info -->
<div class="modal" *ngIf="activeModal === 'infoclass'">
  <div class="modal-content">
    <button class="close" (click)="closeModal()">×</button>
    <h2>Class Info</h2>
    <div *ngIf="selectedClass">
  <p><strong>Name:</strong> {{ selectedClass.name }}</p>
  <p><strong>Stereotype:</strong> {{ getStereotypeName(selectedClass.stereotype) }}</p>
</div>
  </div>
</div>

<div class="modal" *ngIf="activeModal === 'updateclass'">
  <div class="modal-content">
    <button class="close" (click)="closeModal()">×</button>
    <app-updateclass
      [classData]="selectedClass!"
      (close)="onClassChanged()"
    ></app-updateclass>
  </div>
</div>

<div class="modal" *ngIf="activeModal === 'deleteclass'">
  <div class="modal-content">
    <button class="close" (click)="closeModal()">×</button>
    <app-deleteclass
      [classData]="selectedClass!"
      (close)="onClassChanged()"
    ></app-deleteclass>
  </div>
</div>

<style>
.info-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  background: transparent;
  border: none;
  font-size: 1.2em;
  cursor: pointer;
}
.card {
  position: relative;
}
</style>
