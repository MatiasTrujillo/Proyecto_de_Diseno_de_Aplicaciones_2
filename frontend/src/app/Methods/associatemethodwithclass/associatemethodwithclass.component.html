<h2>Asociar método con clase</h2>

<p>Método seleccionado: <strong>{{ methodData.name }}</strong></p>

<form [formGroup]="associateForm" (ngSubmit)="onAssociate()">
  <label for="class">Seleccione una clase:</label>
  <select id="class" formControlName="classId">
    <option value="">-- Seleccione una clase --</option>
    <option *ngFor="let classItem of classes" [value]="classItem.id">
      {{ classItem.name }}
    </option>
  </select>

  <div *ngIf="message" class="success-message">{{ message }}</div>
  <div *ngIf="error" class="error-message">{{ error }}</div>

  <button type="submit">Asociar</button>
  <button type="button" (click)="close.emit()">Cancelar</button>
</form>
