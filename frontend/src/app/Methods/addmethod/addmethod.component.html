<div class="form-container">
  <h2>Add Invoked Method</h2>
  <div *ngIf="error" class="error">{{ error }}</div>
  <div *ngIf="message" class="message">{{ message }}</div>

  <div>
    <label for="invokedMethod">Select Invoked Method:</label>
    <select id="invokedMethod" [(ngModel)]="selectedInvokedMethodId">
      <option value="">-- Select Invoked Method --</option>
      <option *ngFor="let im of invokedMethods" [value]="im.id">
        Reference Name:{{ im.referenceName }} (Method ID: {{ im.methodId }})
        </option>
    </select>
  </div>

  <button class="primary" (click)="addMethod()">Add</button>
  <button class="close" (click)="closeModal()" type="button">Cancel</button>
</div>
