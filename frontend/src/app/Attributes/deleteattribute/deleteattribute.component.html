<div class="delete-container">
  <h2>Delete Attribute</h2>

  <form [formGroup]="deleteForm" (ngSubmit)="onDelete()">
    <label for="attributeId">Select Attribute:</label>
    <select id="attributeId" formControlName="attributeId">
      <option value="">-- Select an attribute --</option>
      <option *ngFor="let attr of attributes" [value]="attr.id">
        {{ attr.name }}
      </option>
    </select>

    <button type="submit">Delete</button>
  </form>

  <div class="message" *ngIf="message">{{ message }}</div>
  <div class="error" *ngIf="error">{{ error }}</div>
</div>
