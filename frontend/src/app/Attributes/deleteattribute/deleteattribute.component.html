<h2>Delete Class</h2>

<p>Are you sure you want to delete the class "{{ attributeData.name }}"?</p>

<div *ngIf="message" class="success-message">{{ message }}</div>
<div *ngIf="error" class="error-message">{{ error }}</div>

<button (click)="onDelete()" class="danger">Confirm Delete</button>
<button (click)="close.emit()">Cancel</button>
