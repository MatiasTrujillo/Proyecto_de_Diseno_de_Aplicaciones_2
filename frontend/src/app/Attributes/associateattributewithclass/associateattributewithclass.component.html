<!-- Atributo mostrado como texto -->
<div>
  <label>Attribute:</label>
  <span>{{ attributeData.name }}</span>
</div>

<!-- Selector de clase -->
<div>
  <label>Class:</label>
  <select [(ngModel)]="selectedClassId">
    <option value="">-- Select Class --</option>
    <option *ngFor="let cls of classes" [value]="cls.id">{{ cls.name }}</option>
  </select>
</div>

<!-- Botón de asociación -->
<button (click)="associate()">Associate</button>

<!-- Mensajes -->
<div *ngIf="message" style="color: green;">{{ message }}</div>
<div *ngIf="error" style="color: red;">{{ error }}</div>
