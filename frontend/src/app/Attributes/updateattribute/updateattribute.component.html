<form [formGroup]="updateForm" (ngSubmit)="onSubmit()">
  <!-- Name -->
  <div class="form-group">
    <label for="name">Name:</label>
    <input id="name" formControlName="name" type="text" class="form-control" />
  </div>

  <!-- Id Reference Type -->
  <div class="form-group">
    <label for="idRefType">Id Reference Type:</label>
    <select id="idRefType" formControlName="IdReferenceType" class="form-control">
      <option *ngFor="let t of types" [value]="t.id">
        {{ t.name }}
      </option>
    </select>
  </div>

  <!-- Id Instance Type -->
  <div class="form-group">
    <label for="idInstType">Id Instance Type:</label>
    <select id="idInstType" formControlName="IdInstanceType" class="form-control">
      <option *ngFor="let t of types" [value]="t.id">
        {{ t.name }}
      </option>
    </select>
  </div>

    <!-- Stereotype -->
  <div class="form-group">
    <label for="stereotype">Stereotype:</label>
    <select id="stereotype" formControlName="stereotype" class="form-control">
      <option *ngFor="let kw of keyWords" [value]="getKeyValue(kw)">
        {{ kw }}
      </option>
    </select>
  </div>

  <div class="form-group">
  <label for="accessibility">Accessibility:</label>
  <select id="accessibility" formControlName="accessibility" class="form-control">
    <option [ngValue]="null">Seleccione una opción</option>
    <option *ngFor="let a of accessibilitys" [ngValue]="getAcceValue(a)">
      {{ a }}
    </option>
  </select>
</div>

  <div class="form-group buttons">
    <button type="submit" class="btn btn-primary">Actualizar</button>
    <button type="button" (click)="close.emit()" class="btn btn-secondary">Cancelar</button>
  </div>
</form>

<!-- Mensajes -->
<div *ngIf="message" class="alert alert-success mt-3">
  {{ message }}
</div>

<div *ngIf="error" class="alert alert-danger mt-3">
  {{ error }}
</div>
