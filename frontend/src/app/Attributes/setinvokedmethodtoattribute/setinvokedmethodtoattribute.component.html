<h2>Associate Method Invocation to Attribute</h2>

<div class="form-group">
  <label for="attribute">Attribute:</label>
  <select [(ngModel)]="selectedAttributeId" class="form-control">
    <option value="">-- Select Attribute --</option>
    <option *ngFor="let attr of attributes" [value]="attr.id">{{ attr.name }}</option>
  </select>
</div>

<div class="form-group">
  <label for="method">Method:</label>
  <select [(ngModel)]="selectedMethodId" class="form-control">
    <option value="">-- Select Method --</option>
    <option *ngFor="let method of methods" [value]="method.id">{{ method.name }}</option>
  </select>
</div>

<button (click)="associate()" class="primary">Associate</button>

<div *ngIf="message" class="success">{{ message }}</div>
<div *ngIf="error" class="error">{{ error }}</div>
