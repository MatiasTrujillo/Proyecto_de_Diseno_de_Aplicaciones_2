<div class="form-container">
  <h2>Create Parameter</h2>

  <div *ngIf="error" class="error">{{ error }}</div>
  <div *ngIf="message" class="message">{{ message }}</div>

  <label for="name">Name:</label>
  <input id="name" type="text" [(ngModel)]="name" />

  <label for="referenceType">Reference Type:</label>
  <select id="referenceType" [(ngModel)]="selectedReferenceTypeId">
    <option [ngValue]="null">-- Select Reference Type --</option>
    <option *ngFor="let type of types" [value]="type.id">{{ type.name }}</option>
  </select>

  <label for="instanceType">Instance Type:</label>
  <select id="instanceType" [(ngModel)]="selectedInstanceTypeId">
    <option [ngValue]="null">-- Select Instance Type --</option>
    <option *ngFor="let type of types" [value]="type.id">{{ type.name }}</option>
  </select>

  <button (click)="createParameter()">Create</button>
</div>
