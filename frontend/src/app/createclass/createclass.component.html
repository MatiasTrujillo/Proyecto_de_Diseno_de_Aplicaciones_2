<div class="form-container">
  <h2>Create a Class</h2>

  <div>
    <label for="className">Class Name:</label>
    <input type="text" id="className" [(ngModel)]="className" required />
  </div>

  <div>
  <label for="stereotype">Stereotype:</label>
  <select id="stereotype" [(ngModel)]="stereotype" required>
    <option [ngValue]="null">-- Select a keyword --</option>
    <option *ngFor="let label of keyWords" [ngValue]="getKeyValue(label)">
      {{ label }}
    </option>
  </select>
</div>

  <button (click)="createClass()">Create</button>

  <p [ngClass]="{ 'error': isError, 'success': !isError }">{{ message }}</p>
</div>
